{{ define "main" }}
<article class="markdown book-article">
  <h1>{{ .Title }}</h1>
  <p><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>{{ if .Draft }} · Черновик{{ end }}</p>
  {{ .Content }}
  <p><a href="{{ "releases/" | relURL }}">← Все релизы</a></p>
</article>
{{ end }}
